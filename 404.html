<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Design Your Destiny</title>
    
    <meta name="description" content="The page you are looking for has shifted realities.">
    <meta name="robots" content="noindex, follow">
    
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    
    <link rel="stylesheet" href="/css/style.min.css">
</head>
<body>
    <div class="cosmic-bg"></div>
    <div class="stars"></div>

    <header>
        <a href="/" class="logo">
            <span class="logo-star">✦</span>
            <span class="logo-text" data-config="brand.name">DESIGN YOUR DESTINY</span>
        </a>
        <nav>
            <ul>
                <li><a href="/" class="nav-link">HOME</a></li>
                <li><a href="/about" class="nav-link">ABOUT</a></li>
                <li><a href="/courses" class="nav-link">JOURNEY</a></li>
                <li><a href="/blog" class="nav-link">BLOG</a></li>
            </ul>
        </nav>
    </header>

    <main id="app-content">
        <section class="active container text-center" style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 80vh;">
            <h1 class="heading-hero fade-up" style="font-size: 6rem; margin-bottom: 0;">404</h1>
            <h2 class="hero-subtitle fade-up" style="margin-top: 0; color: var(--color-champagne-gold);">REALITY NOT FOUND</h2>
            <p class="hero-quote fade-up">The path you are looking for has shifted into a different timeline.</p>
            <a href="/" class="btn btn-primary mt-4 fade-up" style="text-decoration: none; display: inline-block;">RETURN TO HOME <i data-lucide="arrow-right"></i></a>
        </section>
    </main>

    <script src="/js/config.js" defer></script>
    <script src="/js/lucide.min.js" defer></script>
    <script src="/js/main.js" defer></script>
    <script src="/js/animations.js" defer></script>
    <script defer>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });
    </script>
</body>
</html>
